name: Flutter CI

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Web runners
        run: flutter create . --platforms=android,web
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Run Dart language basics example
        run: dart run tool/dart_basics.dart
      - name: Analyze Dart and Flutter source
        run: flutter analyze
      - name: Run unit and widget tests
        run: flutter test
      - name: Build Web release
        run: flutter build web --release
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-connect-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
